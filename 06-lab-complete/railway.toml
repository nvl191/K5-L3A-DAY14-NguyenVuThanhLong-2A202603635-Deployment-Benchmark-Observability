# Deploy Railway:  cd 06-lab-complete && railway up
# Biến AGENT_API_KEY, REDIS_URL, ENVIRONMENT đặt trên dashboard, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
